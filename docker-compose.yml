services:
  # 1. PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: repair-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_EXPOSE_HOST}:${POSTGRES_EXPOSE_PORT}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. 图床服务 EasyImages
  easyimage:
    image: ddsderek/easyimage:latest
    container_name: repair-easyimage
    ports:
      - "${EASYIMAGE_EXPOSE_HOST}:${EASYIMAGE_EXPOSE_PORT}:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./easyimage/config:/app/web/config
      - ./easyimage/i:/app/web/i
    restart: unless-stopped

  # 3. Go 后端
  backend:
    build: ./backend
    container_name: repair-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - EASYIMAGE_URL=http://easyimage:80
      - EASYIMAGE_TOKEN=${EASYIMAGE_TOKEN}
    depends_on:
      - postgres
      - easyimage
    restart: unless-stopped

  # 4. Vue 前端（Nginx）
  web-frontend:
    build: ./web-frontend
    container_name: repair-frontend
    ports:
      - "${FRONTEND_EXPOSE_HOST}:${FRONTEND_EXPOSE_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped